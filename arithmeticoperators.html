<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <script>
        function calculate(op) {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let result;

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").value = "Enter valid numbers";
                return;
            }

            switch(op) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    if (num2 == 0) {
                        result = "Cannot divide by zero";
                    } else {
                        result = num1 / num2;
                    }
                    break;
            }

            document.getElementById("result").value = result;
        }
    </script>
</head>
<body>

<h2>Simple Calculator</h2>

<form>
    Number 1:
    <input type="number" id="num1"><br><br>

    Number 2:
    <input type="number" id="num2"><br><br>

    <input type="button" value="Add" onclick="calculate('+')">
    <input type="button" value="Subtract" onclick="calculate('-')">
    <input type="button" value="Multiply" onclick="calculate('*')">
    <input type="button" value="Divide" onclick="calculate('/')">

    <br><br>

    Result:
    <input type="text" id="result" readonly>
</form>

</body>
</html>
