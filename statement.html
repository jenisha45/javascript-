<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break and continue statements </title>
</head>

<body>
    <!-- <h2>JavaScript Break and Continue</h2> -->
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
        let text1 = "";
        for (let i = 0; i < 10; i++) {
            text1 += "The number is " + i + "<br>";
            if (i === 3) { break; }
        }
        let text2 = "";
        for (let i = 1; i < 10; i++) {
            text2 += "The number is " + i + "<br>";
            if (i === 3) { continue; }
        }
        document.getElementById("demo1").innerHTML = text1;
        document.getElementById("demo2").innerHTML = text2;
    </script>

    <noscript>
        <p style="color: red;">⚠️ JavaScript is disabled. Please enable it for full functionality.</p>
    </noscript>
</body>

</html>
