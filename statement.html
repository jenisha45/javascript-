<html>
  <head><title>
    use of break and continue
  </title></head>
  <body>
    <script>
      for (let i = 0; i < 10; i++) {
  if (i === 3) { break; }
  text += "The number is " + i + "<br>";
}

      for (let i = 1; i < 10; i++) {
  if (i === 3) { continue; }
  text += "The number is " + i + "<br>";
}
    </script>

      <noscript>
        <p style="color: red;">⚠️ JavaScript is disabled. Please enable it for full functionality.</p>
    </noscript>
  </body>
</html>
