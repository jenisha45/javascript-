<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    form {
        max-width: 400px;
        margin: auto;
    }

    label {
        display: block;
        margin-top: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="file"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
    }

    input[type="submit"] {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #45a049;
    }
</style>
</head>
<script>
    function validateForm() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (username === "" || email === "" || password === "") {
            alert("All fields must be filled out");
            return false;
        }
        if (password.length < 6) {
            alert("Password must be at least 6 characters long");
            return false;
        }
        let number = document.getElementById('number').value;
        if (number === "" || isNaN(number)) {
            alert("Please enter a valid number");
            return false;
        }
        return true;
    }
</script>

<body>
    <h2>Registration Form</h2>
    <form action="submit_form.php" method="post" onsubmit="return validateForm()">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required maxlength="10"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="number">Number:</label>
        <input type="number" id="number" name="number" required><br><br>

        <label for="post">Post</label><br>
        <input type="text" id="post" name="post" value="Student" readonly><br><br>

        <label for="datemin">Enter a date after 2000-01-01 upto 2026-12-31</label>
        <input type="date" id="datemin" name="datemin" min="2000-01-02" max="2026-12-31" required>
        <br><br>

        <label for="files">Select files:</label>
        <input type="file" id="files" name="files" multiple>
        <br><br>

        <input type="submit" value="Register">
    </form>
</body>

</html>
